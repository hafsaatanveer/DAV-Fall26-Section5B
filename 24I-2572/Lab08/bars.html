
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAV Lab 8 - Task 2</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #chart {
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <h1>GDP per Capita by Country</h1>
    <p>DAV Lab 8 — Task 2</p>

    <div id="chart"></div>

    <script>
        const width = 1000;
        const height = 500;
        
        const margin = {
            top: 20,
            right: 30,
            bottom: 50,
            left: 110
        };

        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const chart = svg.append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        d3.csv("gapminder.csv", d3.autoType)
            .then(data => {

               // Select the year 2007 and find the 10 richest countries
const latestYear = 2007;

const countryData = data
    .filter(d => d.year === latestYear)
    .sort((a, b) => b.gdpPercap - a.gdpPercap)
    .slice(0, 10);
                const x = d3.scaleLinear()
                    .domain([
                        0,
                        d3.max(countryData, d => d.gdpPercap)
                    ])
                    .range([0, innerWidth]);

                const y = d3.scaleBand()
                    .domain(countryData.map(d => d.country))
                    .range([0, innerHeight])
                    .padding(0.1);

                chart.selectAll("rect")
                    .data(countryData)
                    .join("rect")
                    .attr("x", 0)
                    .attr("y", d => y(d.country))
                    .attr("width", d => x(d.gdpPercap))
                    .attr("height", y.bandwidth())
                    .attr("fill", "steelblue");

                chart.append("g")
                    .attr("transform",
                        `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(x));

                chart.append("g")
                    .call(d3.axisLeft(y));

                console.log("Countries displayed:", countryData.length);
            })
            .catch(error => {
                console.error("CSV loading error:", error);
            });
    </script>

</body>
</html>
